<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Details | Bliss Legacy Limited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="assets/images/bliss-legacy-logo.png" alt="Bliss Legacy"></div>
      <div class="section-label">Properties</div>
      <a href="properties.html">Listings</a>
      <div class="section-label">Account</div>
      <a href="#" id="logoutBtn">Logout</a>
    </aside>
    <main class="dash-main">
      <div class="dash-top">
        <div>
          <h1 id="pageTitle">Property Details</h1>
          <p id="pageSub" style="color:var(--muted);font-size:13px"></p>
        </div>
        <div style="display:flex;gap:8px">
          <a class="btn btn-outline" href="properties.html">Back</a>
          <button class="btn btn-green" id="publishBtn">Publish</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px">
        <div class="card">
          <div class="gallery" style="margin-bottom:16px">
            <div class="gallery-main" style="height:400px"><img id="mainImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:8px"></div>
            <div class="gallery-thumbs" id="galleryThumbs" style="display:flex;gap:8px;flex-wrap:wrap"></div>
          </div>
          <h2 id="detailTitle"></h2>
          <p id="detailMeta" style="color:var(--muted);font-size:13px;margin-bottom:16px"></p>
          <div style="margin-bottom:16px">
            <h3 style="font-size:16px;margin-bottom:8px">Description</h3>
            <p id="detailDesc"></p>
          </div>
          <div style="margin-bottom:16px">
            <h3 style="font-size:16px;margin-bottom:8px">Features</h3>
            <div id="detailFeatures" style="display:flex;flex-wrap:wrap;gap:8px"></div>
          </div>
        </div>
        <div class="card" style="position:sticky;top:20px">
          <h3 style="font-size:16px;margin-bottom:12px">Property Information</h3>
          <div class="meta" style="margin-bottom:16px">
            <div class="meta-item"><span>Price</span><strong id="detailPrice">-</strong></div>
            <div class="meta-item"><span>Status</span><strong id="detailStatus">-</strong></div>
            <div class="meta-item"><span>Category</span><strong id="detailCategory">-</strong></div>
            <div class="meta-item"><span>Branch</span><strong id="detailBranch">-</strong></div>
            <div class="meta-item"><span>Bedrooms</span><strong id="detailBeds">-</strong></div>
            <div class="meta-item"><span>Bathrooms</span><strong id="detailBaths">-</strong></div>
            <div class="meta-item"><span>Parking</span><strong id="detailParking">-</strong></div>
          </div>
          <h3 style="font-size:16px;margin-bottom:8px">Status History</h3>
          <div id="statusHistory" style="font-size:12px;color:var(--muted)"></div>
          <div style="margin-top:18px;display:flex;gap:8px">
            <select id="statusSelect" style="padding:10px 14px;border:1px solid var(--line);border-radius:7px;flex:1"></select>
            <button class="btn btn-green" id="changeStatusBtn" style="padding:10px 18px">Change Status</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/js/property-details.js"></script>
</body>
</html>
