<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="assets/js/security-ui.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#00B522" />
  <title>Portal Login | Bliss Legacy Limited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    body {
      background-color: var(--soft);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
    }
    .login-header {
      text-align: center;
      margin-bottom: 26px;
    }
    .login-logo {
      width: 175px;
      height: auto;
      margin: 0 auto 16px;
      display: block;
    }
    .login-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-form .form-group input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      font-size: 14px;
    }
    .login-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-top: 4px;
    }
    .login-links a {
      color: var(--green-dark);
      font-weight: 600;
    }
    .back-home-link {
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-home-link:hover {
      color: var(--green-dark);
    }
  </style>
  <link rel="stylesheet" href="assets/css/motion.css">
  <link rel="stylesheet" href="assets/css/passkeys.css">
  <script src="assets/js/intro-config.js"></script>
  <script src="assets/js/motion.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bliss Legacy">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <a href="index.html">
        <img src="assets/images/bliss-legacy-logo.png" alt="Bliss Legacy Limited Logo" class="login-logo" data-fallback-src="bliss-legacy-logo.png">
      </a>
      <h1 class="login-title">Portal Sign In</h1>
      <p class="login-subtitle">Access your client account or staff management portal</p>
    </div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="email" style="font-size:12px;font-weight:600;color:var(--charcoal)">Email Address</label>
        <input type="email" id="email" placeholder="name@company.com" required>
      </div>

      <div class="form-group">
        <label for="password" style="font-size:12px;font-weight:600;color:var(--charcoal)">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="login-links">
        <a href="signup.html">Create client account</a>
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <button class="btn btn-green btn-block" type="submit" id="submitBtn">Sign In to Account</button>
      <div id="msg" style="color:#c0392b;font-size:13px;text-align:center;min-height:18px"></div>

      <div class="pk-divider">or sign in securely</div>
      <button class="pk-btn" type="button" id="passkeyLoginBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/></svg>
        <span>Continue with Passkey</span>
      </button>
      <p class="pk-hint">Use fingerprint, Face ID, Windows Hello or your device PIN. Your password still works.</p>
      <p class="pk-hint" id="passkeyUnsupported" hidden></p>
    </form>
  </div>

  <a href="index.html" class="back-home-link">← Return to Homepage</a>

  <script src="assets/js/passkeys.js"></script>
  <script src="assets/js/login-page.js"></script>
  <script src="assets/js/mobile-nav.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/password-toggle.js"></script>
  <script src="assets/js/digital-human.js" defer></script>
</body>
</html>
