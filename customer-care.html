<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Care | Bliss Legacy Limited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/motion.css">
  <script src="assets/js/intro-config.js"></script>
  <script src="assets/js/motion.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bliss Legacy">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <meta name="theme-color" content="#00B522" />
</head>
<body data-page="care">
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="dash-main">
      <section class="role-hero">
        <h1>Customer Care</h1>
        <p>Clear new clients, log every call and keep follow-ups moving. Customer care has no commission access.</p>
        <div class="role-hero-meta" id="careMeta"></div>
      </section>

      <div class="kpi-grid kpi-grid-5" id="careKpis"></div>

      <div class="card section-gap">
        <div class="card-head"><h3>Client care queue</h3><span class="small muted" id="careCount"></span></div>
        <div class="filters mb-16">
          <input type="search" id="careSearch" placeholder="Search client, reference or phone…">
          <select id="careStatus"><option value="">All clients</option><option value="pending_clearance">Pending clearance</option><option value="cleared">Cleared</option></select>
          <label class="small muted" for="careFrom">From</label>
          <input type="date" id="careFrom" title="Client registered from">
          <label class="small muted" for="careTo">To</label>
          <input type="date" id="careTo" title="Client registered to">
          <select id="careBranch"><option value="">All branches</option></select>
          <button class="btn btn-green btn-sm" type="button" id="applyCareFilters">Filter</button>
          <button class="btn btn-ghost btn-sm" type="button" id="resetCareFilters">Reset</button>
        </div>
        <div class="table-responsive"><table class="table">
          <thead><tr><th>Client</th><th>Branch</th><th>Care status</th><th>Last call</th><th>Next follow-up</th><th>Calls</th><th>Actions</th></tr></thead>
          <tbody id="careBody"><tr><td colspan="7">Loading care queue…</td></tr></tbody>
        </table></div>
        <div class="toolbar mt-16" style="justify-content:space-between">
          <span class="small muted" id="carePageLabel"></span>
          <div class="toolbar">
            <button class="btn btn-ghost btn-sm" type="button" id="carePrev">← Previous</button>
            <button class="btn btn-ghost btn-sm" type="button" id="careNext">Next →</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="careDetailModal">
    <div class="modal-box modal-wide">
      <div class="modal-header"><h3 id="careDetailTitle">Client care</h3><button class="icon-btn" type="button" data-close-modal="careDetailModal">✕</button></div>
      <div id="careDetailBody"><div class="empty-state">Loading…</div></div>
    </div>
  </div>

  <script src="assets/js/staff-shell.js"></script>
  <script src="assets/js/customer-care.js"></script>
  <script src="assets/js/mobile-nav.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
