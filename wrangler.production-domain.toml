name = "bliss-legacy-limited"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bliss-legacy-db"
database_id = "f0252b4a-20ac-4706-a269-8281c3838db5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bliss-legacy-files"

[[kv_namespaces]]
binding = "CACHE"
id = "5e35ae0d4ffb48fcb3cff84698c35985"

[[queues.producers]]
binding = "TASKS"
queue = "bliss-legacy-tasks"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[triggers]
crons = ["0 6 * * *"]

[vars]
ENVIRONMENT = "production"
DEMO_MODE_ENABLED = "0"
DEFAULT_GRACE_DAYS = "0"
PAYMENT_MODE = "live"

[observability]
enabled = true
