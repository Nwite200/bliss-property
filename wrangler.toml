name = "bliss-property"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bliss-legacy-staging-db"
database_id = "294d118f-96c1-4878-ad56-a33d0b866958"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bliss-legacy-staging-files"

[[kv_namespaces]]
binding = "CACHE"
id = "c8968754a05a4b38b29320e79b8ee3ba"

[[queues.producers]]
binding = "TASKS"
queue = "bliss-legacy-staging-tasks"

[[queues.consumers]]
queue = "bliss-legacy-staging-tasks"
max_batch_size = 10
max_batch_timeout = 5

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[triggers]
crons = ["0 6 * * *"]

[vars]
ENVIRONMENT = "staging"
DEMO_MODE_ENABLED = "0"

[observability]
enabled = true
