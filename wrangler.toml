name = "bliss-legacy-limited"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bliss-legacy-db"
database_id = "f0252b4a-20ac-4706-a269-8281c3838db5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bliss-legacy-files"

[[kv_namespaces]]
binding = "CACHE"
id = "424f8f6d26624f0687508339b20b9004"

[[queues.producers]]
binding = "TASKS"
queue = "bliss-legacy-tasks"

[[queues.consumers]]
queue = "bliss-legacy-tasks"
max_batch_size = 10
max_batch_timeout = 5

[triggers]
crons = ["0 6 * * *"]

[vars]
ENVIRONMENT = "production"
DEMO_MODE_ENABLED = "0"

[observability]
enabled = true
