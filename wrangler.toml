name = "bliss-property"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bliss-legacy-staging-db"
database_id = "57cbf77c-f99e-4bf7-9a29-0a3e18a8b89a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bliss-legacy-staging-file"

[[kv_namespaces]]
binding = "CACHE"
id = "42bc72e5a1dd42f18e4469c8f7c8a7f1"

[[queues.producers]]
binding = "TASKS"
queue = "bliss-legacy-staging-tasks"

[[queues.consumers]]
queue = "bliss-legacy-staging-tasks"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[triggers]
crons = ["0 6 * * *"]

[vars]
ENVIRONMENT = "staging"
DEMO_MODE_ENABLED = "0"
DEFAULT_GRACE_DAYS = "0"
PAYMENT_MODE = "test"

[observability]
enabled = true
